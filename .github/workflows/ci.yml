name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Test API
        working-directory: apps/api
        run: python -m unittest discover -s tests -v
      - name: Test and build web
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - name: Smoke test offline servers
        run: |
          (cd apps/api && exec env -u GITHUB_TOKEN python -m app.offline) &
          api_pid=$!
          (cd apps/web && exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1) &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 10 --retry-connrefused http://127.0.0.1:8000/health | grep -F '"mode":"offline"'
          curl -fsS http://127.0.0.1:8000/repos | grep -F 'splash-demo/inventory-service'
          curl -fsS --retry 10 --retry-connrefused http://127.0.0.1:3000/repositories | grep -F 'Repository browser shell' >/dev/null
          curl -fsS 'http://127.0.0.1:3000/editor?repo=splash-demo%2Finventory-service&path=config%2Fservice.json' >/dev/null
